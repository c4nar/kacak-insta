<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kaçak İnsta — Direkt Mesajlar</title>
<style>
:root{
  --bg:#fafafa; --panel:#ffffff; --border:#dbdbdb; --text:#262626; --muted:#8e8e8e;
  --blue:#0095f6; --grad:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
  --bubble-me:#efefef; --bubble-other:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:15px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#c7c7c7;border-radius:3px}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed;inset:0;background:#0b0b12;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;overflow:hidden}
#loginScreen::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);filter:blur(90px);opacity:.35;animation:spinBg 14s linear infinite}
@keyframes spinBg{to{transform:rotate(360deg)}}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:floatOrb 9s ease-in-out infinite}
@keyframes floatOrb{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}
.login-card{position:relative;background:rgba(20,20,30,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);border-radius:24px;padding:38px 30px;width:100%;max-width:380px;box-shadow:0 24px 70px rgba(0,0,0,.55);text-align:center;animation:cardIn .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.login-logo{font-size:36px;font-weight:900;background:var(--grad);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;letter-spacing:-1px;animation:logoShift 4s ease infinite}
@keyframes logoShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.login-sub{color:#b8b8c8;font-size:13.5px;margin-bottom:22px}
#loginAvatar{width:86px;height:86px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;background:var(--grad);box-shadow:0 8px 24px rgba(214,41,118,.45);overflow:hidden;position:relative;transition:transform .2s}
#loginAvatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
#loginNamePrev{font-weight:700;font-size:19px;min-height:24px;margin-bottom:10px;color:#eee}
#nameInput{width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,.18);border-radius:14px;outline:none;background:rgba(255,255,255,.07);color:#fff;margin-bottom:10px;transition:border-color .2s, box-shadow .2s}
#nameInput::placeholder{color:#77778a}
#nameInput:focus{border-color:#d62976;box-shadow:0 0 0 4px rgba(214,41,118,.18)}
.color-row{display:flex;gap:10px;justify-content:center;margin:8px 0 18px;flex-wrap:wrap;min-height:34px}
.color-dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s;border-color:rgba(255,255,255,.25)}
.color-dot.sel{border-color:#fff;transform:scale(1.2)}
.rgb-animated{background:linear-gradient(45deg,#ff004c,#ff8a00,#ffe600,#00e436,#00b3ff,#6a00ff,#ff004c);background-size:400% 400%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rgbFlow .8s linear infinite}
@keyframes rgbFlow{0%{background-position:0% 50%}100%{background-position:400% 50%}}
.btn-primary{width:100%;padding:13px;border-radius:14px;background:var(--grad);background-size:200% 200%;color:#fff;font-weight:700;font-size:15.5px;letter-spacing:.3px;transition:transform .15s, filter .2s;animation:logoShift 4s ease infinite}
.btn-primary:not(:disabled):hover{filter:brightness(1.1)}
.btn-primary:not(:disabled):active{transform:scale(.97)}
.btn-primary:disabled{opacity:.35;cursor:default;filter:grayscale(.6)}
.login-err{color:#ff6b81;font-size:13px;min-height:18px;margin-bottom:6px}

/* ---------- APP LAYOUT ---------- */
#app{display:none;height:100dvh}
#app.active{display:flex}
#sidebar{width:340px;min-width:300px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-head{padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.side-head h1{font-size:21px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.icon-btn{font-size:20px;padding:7px;border-radius:9px;color:#444}
.icon-btn:hover{background:#efefef}
.icon-btn svg{display:block}
.me-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.me-row:hover{background:#fafafa}
#roomList{flex:1;overflow-y:auto}
.room-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid #efefef}
.room-item:hover{background:#fafafa}
.room-item.active{background:#efefef}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:17px;flex-shrink:0;overflow:hidden;position:relative}
.avatar.sm{width:36px;height:36px;font-size:14px}
.avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.room-meta{flex:1;min-width:0}
.room-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-preview{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#emptyState{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}
#emptyState .biglogo{width:110px;height:110px;border-radius:28px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(150,47,191,.35)}
#emptyState .biglogo svg{width:56px;height:56px;stroke:#fff}
#chatView{flex:1;display:none;flex-direction:column;min-width:0}
#chatView.active{display:flex}
.chat-head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
#backBtn{display:none;padding:4px 8px;color:#333}
#backBtn svg{width:26px;height:26px}
.chat-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-sub{color:var(--muted);font-size:12px}
.head-actions{margin-left:auto;display:flex;gap:4px}
#msgArea{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.day-sep{text-align:center;margin:10px 0}
.day-sep span{background:#dbdbdb;color:#fff;font-size:11px;padding:3px 12px;border-radius:10px}
.msg-row{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
.msg-row.mine{flex-direction:row-reverse}
.msg-bubble{max-width:70%;padding:9px 13px;border-radius:18px;background:var(--bubble-other);border:1px solid var(--border);font-size:14.5px;line-height:1.4;word-wrap:break-word;overflow:hidden}
.mine .msg-bubble{background:var(--bubble-me);border-color:var(--bubble-me)}
.msg-bubble img.shared{max-width:230px;max-height:280px;border-radius:12px;display:block;cursor:pointer}
.msg-sender{font-size:11.5px;font-weight:700;margin-bottom:3px}
.msg-time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
.msg-row.mine .msg-time{text-align:left}
#composer{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--border);background:var(--panel)}
#msgInput{flex:1;border:1px solid var(--border);border-radius:22px;padding:11px 16px;outline:none;background:#fafafa}
.comp-btn{padding:8px;flex-shrink:0;color:#444;border-radius:50%;display:flex;align-items:center;justify-content:center}
.comp-btn svg{width:22px;height:22px}
.comp-btn:hover{background:#efefef}
#sendBtn{color:var(--blue);font-weight:800;font-size:15px;padding:8px 6px}
#micBtn.rec{color:#ed4956;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}

/* ---------- MODALS ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:380px;max-height:85dvh;overflow-y:auto;animation:cardIn .3s ease}
.modal-card h3{margin-bottom:16px;font-size:17px}
.modal-card input[type=text],.modal-card input:not([type]){width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:11px;outline:none;margin-bottom:12px;background:#fafafa}
.modal-actions{display:flex;gap:10px;margin-top:8px}
.btn-ghost{flex:1;padding:12px;border-radius:11px;border:1px solid var(--border);font-weight:600}
.member-chk{display:flex;align-items:center;gap:10px;padding:8px 2px;cursor:pointer;border-bottom:1px solid #f0f0f0}
#imgPreview{width:100%;border-radius:10px;margin-bottom:12px;display:none}
.file-btn{display:block;width:100%;padding:11px;border:1px dashed var(--border);border-radius:11px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer;margin-bottom:12px}
.file-btn:hover{border-color:var(--blue);color:var(--blue)}

/* lightbox */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:80}
#lightbox.open{display:flex}
#lightbox img{max-width:94vw;max-height:88dvh;border-radius:8px}

/* ---------- CALL OVERLAY ---------- */
#callOverlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#1d1d2b,#0a0a10);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff}
#callOverlay.open{display:flex}
#callPeerAvatar{width:110px;height:110px;font-size:42px;box-shadow:0 0 0 6px rgba(255,255,255,.08)}
#callStatus{color:#bbb;font-size:15px}
.call-actions{display:flex;gap:22px;margin-top:20px}
.call-btn{width:58px;height:58px;border-radius:50%;background:#2a2a38;display:flex;align-items:center;justify-content:center;color:#fff}
.call-btn svg{width:26px;height:26px}
.call-btn.end{background:#ed4956}
.call-btn.ans{background:#2ecc71}
#localVideo{position:absolute;bottom:20px;right:16px;width:110px;height:150px;border-radius:12px;object-fit:cover;border:2px solid #444;display:none}
.ringing{animation:ringShake 1.2s infinite}
@keyframes ringShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}

/* ---------- MOBILE ---------- */
@media (max-width:768px){
  #sidebar{width:100%;min-width:0;border-right:none}
  #main{display:none}
  body.in-chat #sidebar{display:none}
  body.in-chat #main{display:flex}
  #backBtn{display:block}
  .msg-bubble{max-width:78%}
  .msg-bubble img.shared{max-width:200px;max-height:240px}
  .avatar{width:44px;height:44px}
}
</style>
<base target="_blank">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="orb" style="width:140px;height:140px;top:8%;left:6%;background:#d62976;filter:blur(60px)"></div>
  <div class="orb" style="width:180px;height:180px;bottom:6%;right:4%;background:#4f5bd5;filter:blur(70px);animation-delay:-4s"></div>
  <div class="orb" style="width:100px;height:100px;top:55%;left:12%;background:#fa7e1e;filter:blur(50px);animation-delay:-2s"></div>
  <div class="login-card">
    <div class="login-logo">Kaçak İnsta</div>
    <div class="login-sub">Takma adını seç, kimliğini kap — mesajlaşmaya başla</div>
    <div id="loginAvatar">?</div>
    <div id="loginNamePrev"></div>
    <input id="nameInput" maxlength="20" placeholder="Takma ad (örn. c4nar)" autocomplete="off">
    <div class="login-err" id="loginErr"></div>
    <div class="color-row" id="colorRow"></div>
    <button class="btn-primary" id="loginBtn" disabled>Adı Sahiplen &amp; Genel'e Katıl</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="sidebar">
    <div class="side-head">
      <h1>Mesajlar</h1>
      <button class="icon-btn" id="newGroupBtn" title="Yeni grup"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </div>
    <div class="me-row" id="meRow">
      <div class="avatar" id="meAvatar"></div>
      <div class="room-meta">
        <div class="room-name" id="meName"></div>
        <div class="room-preview">Profili düzenlemek için dokun · çevrimiçi</div>
      </div>
    </div>
    <div id="roomList"></div>
  </div>

  <div id="main">
    <div id="emptyState">
      <div class="biglogo"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
      <div style="font-size:17px;font-weight:700;color:var(--text)">Mesajların</div>
      <div style="font-size:13px">Bir sohbet seç ya da grup kur</div>
    </div>

    <div id="chatView">
      <div class="chat-head">
        <button id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="avatar sm" id="chatAvatar"></div>
        <div style="min-width:0">
          <div class="chat-title" id="chatTitle"></div>
          <div class="chat-sub" id="chatSub"></div>
        </div>
        <div class="head-actions">
          <button class="icon-btn" id="voiceCallBtn" title="Sesli arama"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
          <button class="icon-btn" id="videoCallBtn" title="Görüntülü arama"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></button>
          <button class="icon-btn" id="roomInfoBtn" title="Grup bilgisi"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
        </div>
      </div>
      <div id="msgArea"></div>
      <div id="composer">
        <button class="comp-btn" id="imgBtn" title="Fotoğraf gönder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
        <input id="msgInput" placeholder="Mesaj yaz…" autocomplete="off">
        <button class="comp-btn" id="micBtn" title="Basılı tut, ses kaydet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4M8 23h8"/></svg></button>
        <button id="sendBtn">Gönder</button>
        <input type="file" id="imgFile" accept="image/*" hidden>
      </div>
    </div>
  </div>
</div>

<!-- GROUP MODAL -->
<div class="modal" id="groupModal">
  <div class="modal-card">
    <h3>Grup oluştur</h3>
    <input id="groupName" maxlength="24" placeholder="Grup adı">
    <label class="file-btn" for="groupPhotoFile">Grup fotoğrafı seç (isteğe bağlı)</label>
    <input type="file" id="groupPhotoFile" accept="image/*" hidden>
    <img id="imgPreview" alt="">
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Üye ekle</div>
    <div id="memberList"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelGroupBtn">Vazgeç</button>
      <button class="btn-ghost" id="createGroupBtn" style="background:var(--blue);color:#fff;border:none">Oluştur</button>
    </div>
  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">
  <div class="modal-card">
    <h3>Profili düzenle</h3>
    <input id="newNameInput" maxlength="20" placeholder="Yeni takma ad">
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">İsim rengi</div>
    <div class="color-row" id="profileColorRow" style="justify-content:flex-start"></div>
    <label class="file-btn" for="profilePhotoFile">Profil fotoğrafı seç</label>
    <input type="file" id="profilePhotoFile" accept="image/*" hidden>
    <div class="login-err" id="profileErr"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelProfileBtn">Vazgeç</button>
      <button class="btn-ghost" id="saveProfileBtn" style="background:var(--blue);color:#fff;border:none">Kaydet</button>
    </div>
  </div>
</div>

<!-- ROOM INFO MODAL -->
<div class="modal" id="infoModal">
  <div class="modal-card">
    <h3 id="infoTitle">Grup bilgisi</h3>
    <div id="infoBody"></div>
    <div class="modal-actions"><button class="btn-ghost" id="closeInfoBtn">Kapat</button></div>
  </div>
</div>

<div id="lightbox"><img id="lightboxImg" alt=""></div>

<!-- CALL OVERLAY -->
<div id="callOverlay">
  <div class="avatar" id="callPeerAvatar"></div>
  <div style="font-size:20px;font-weight:700" id="callPeerName"></div>
  <div id="callStatus">Aranıyor…</div>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="call-actions">
    <button class="call-btn" id="muteBtn" title="Sessiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4M8 23h8"/></svg></button>
    <button class="call-btn end" id="endCallBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67M5.34 9.61a19.8 19.8 0 0 1-3.34-2.68A2 2 0 0 1 0 12v-3a2 2 0 0 1 2.18-2 19.9 19.9 0 0 1 8.63 3.07"/><path d="M1 1l22 22"/></svg></button>
    <button class="call-btn ans" id="answerBtn" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
  </div>
</div>

<script>
"use strict";
/* ================= STORE ================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ console.warn("quota", e); return false; } }
};
const K = { users:"ki_users", groups:"ki_groups", me:"ki_me", msg:r=>"ki_msgs_"+r };
const COLORS = ["#262626","#e1306c","#8e44ad","#0095f6","#2ecc71","#f39c12","#e74c3c"];
const RGB = "rgb";
const C4NAR = "c4nar";

let users  = LS.get(K.users, {});
let groups = LS.get(K.groups, {});
let me     = LS.get(K.me, null);
let currentRoom = null;

/* ================= SES EFEKTLERİ (Web Audio, dosyasız) ================= */
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==="suspended") actx.resume(); return actx; }
function beep(freq, dur, type, vol, when){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type||"sine"; o.frequency.value = freq;
  const t = a.currentTime + (when||0);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||0.18, t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+0.05);
}
const SFX = {
  send(){ beep(620,.09,"sine",.15,0); beep(920,.12,"sine",.12,.06); },           // fısıltı-çıkış
  receive(){ beep(880,.12,"sine",.16,0); beep(1318,.16,"sine",.13,.08); },        // gelen zil
  login(){ [523,659,784,1046].forEach((f,i)=>beep(f,.22,"triangle",.14,i*.09)); },// giriş arpeji
  pop(){ beep(440,.07,"square",.06,0); },                                        // tık
  group(){ beep(660,.12,"triangle",.13,0); beep(990,.18,"triangle",.11,.09); },
  callEnd(){ beep(520,.15,"sawtooth",.1,0); beep(330,.28,"sawtooth",.1,.1); }      // kapanış inişi
};
let ringTimer = null;
function startRing(){ stopRing(); SFX.ring = ()=>{ beep(1200,.18,"sine",.16,0); beep(1200,.18,"sine",.16,.35); }; ringTimer = setInterval(()=>SFX.ring(), 1600); SFX.ring(); }
function stopRing(){ if(ringTimer){ clearInterval(ringTimer); ringTimer=null; } }

/* cross-tab sync */
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel("ki_sync") : null;
let seenMsgIds = {};
function scanMsgIds(){ const s={}; Object.keys(groups).concat(["general"]).forEach(r=>{ const a=LS.get(K.msg(r),[]); const m=a[a.length-1]; if(m) s[r]=m.id; }); return s; }
function broadcast(){ if(bc) bc.postMessage("sync"); }
if(bc) bc.onmessage = ()=>{
  users = LS.get(K.users,{}); groups = LS.get(K.groups,{});
  const now = scanMsgIds();
  for(const r in now){
    if(seenMsgIds[r] && now[r] !== seenMsgIds[r]){
      const arr = LS.get(K.msg(r), []);
      const m = arr[arr.length-1];
      if(m && m.from !== me) SFX.receive();
    }
  }
  seenMsgIds = now;
  renderRooms(); renderMessages(); renderMe();
};
window.addEventListener("storage", e=>{
  if(e.key===K.users||e.key===K.groups){
    users=LS.get(K.users,{}); groups=LS.get(K.groups,{});
    renderRooms(); renderMessages(); renderMe();
  }
});
function saveUsers(){ if(!LS.set(K.users, users)) alert("Depolama dolu — fotoğraf çok büyük olabilir."); broadcast(); }
function saveGroups(){ if(!LS.set(K.groups, groups)) alert("Depolama dolu."); broadcast(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function nameHTML(name){
  const u = users[name] || {};
  if(u.color === RGB) return `<span class="rgb-animated" style="font-weight:800">${esc(name)}</span>`;
  return `<span style="color:${u.color||"#262626"}">${esc(name)}</span>`;
}
function avatarHTML(name, cls=""){
  const u = users[name] || {};
  const img = u.photo ? `<img src="${u.photo}" alt="">` : "";
  return `<div class="avatar ${cls}">${img}${esc((name||"?")[0].toUpperCase())}</div>`;
}

/* ================= LOGIN / CLAIM ================= */
const nameInput = document.getElementById("nameInput");
const loginBtn  = document.getElementById("loginBtn");
const loginErr  = document.getElementById("loginErr");
const namePrev  = document.getElementById("loginNamePrev");
const loginAv   = document.getElementById("loginAvatar");
let chosenColor = COLORS[0];

function rgbAllowed(name){ return name === C4NAR; }

function buildColorRow(rowEl, onPick, selected, allowRgb){
  rowEl.innerHTML = "";
  COLORS.concat(allowRgb ? [RGB] : []).forEach(c=>{
    const d = document.createElement("div");
    d.className = "color-dot" + (c===RGB ? " rgb-animated" : "");
    if(c===RGB) d.style.background = "linear-gradient(45deg,#ff004c,#ff8a00,#ffe600,#00e436,#00b3ff,#6a00ff,#ff004c)";
    else d.style.background = c;
    if(c===selected) d.classList.add("sel");
    d.onclick = ()=>{ rowEl.querySelectorAll(".color-dot").forEach(x=>x.classList.remove("sel")); d.classList.add("sel"); onPick(c); SFX.pop(); };
    rowEl.appendChild(d);
  });
}
buildColorRow(document.getElementById("colorRow"), c=>{ chosenColor=c; paintPreview(); }, COLORS[0], false);

function paintPreview(){
  const n = nameInput.value.trim();
  loginErr.textContent = (n && users[n]) ? "Bu ad zaten kapılmış." : "";
  if(!n){ namePrev.innerHTML = `<span style="color:#55556a">adını yaz, rengin belirsin…</span>`; loginAv.innerHTML = "?"; return; }
  namePrev.innerHTML = (chosenColor === RGB) ? `<span class="rgb-animated">${esc(n)}</span>` : `<span style="color:${chosenColor}">${esc(n)}</span>`;
  loginAv.innerHTML = esc(n[0].toUpperCase());
  loginAv.style.background = (chosenColor===RGB) ? "" : chosenColor;
}
nameInput.addEventListener("input", ()=>{
  const v = nameInput.value.trim();
  loginBtn.disabled = !v;
  buildColorRow(document.getElementById("colorRow"), c=>{ chosenColor=c; paintPreview(); }, (chosenColor===RGB && !rgbAllowed(v)) ? COLORS[0] : chosenColor, rgbAllowed(v));
  paintPreview();
});
nameInput.addEventListener("keydown", e=>{ if(e.key==="Enter" && !loginBtn.disabled) loginBtn.click(); });

loginBtn.onclick = ()=>{
  const name = nameInput.value.trim();
  if(!name) return;
  if(users[name]){ loginErr.textContent = "Bu ad zaten kapılmış."; return; }
  users[name] = { color: chosenColor, photo: null, claimedAt: Date.now() };
  me = name;
  LS.set(K.me, me);
  saveUsers();
  SFX.login();
  enterApp();
};

/* ================= APP BOOT ================= */
function enterApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").classList.add("active");
  renderMe(); renderRooms();
  seenMsgIds = scanMsgIds();
  openRoom("general");
}
function renderMe(){
  const u = users[me] || {};
  document.getElementById("meName").innerHTML = nameHTML(me);
  const av = document.getElementById("meAvatar");
  av.outerHTML = avatarHTML(me).replace('class="avatar"','class="avatar" id="meAvatar"');
  if(u.photo){ document.getElementById("meAvatar").innerHTML = `<img src="${u.photo}">`; }
}

/* ================= ROOMS ================= */
function allRooms(){
  const list = [{ id:"general", name:"Genel", photo:null, isGroup:true, members:Object.keys(users) }];
  Object.entries(groups).forEach(([id,g])=>{
    if(g.members.includes(me)) list.push({ id, ...g });
  });
  return list;
}
function lastMsg(roomId){
  const arr = LS.get(K.msg(roomId), []);
  return arr[arr.length-1] || null;
}
const icoImg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
const icoMic = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>';
function renderRooms(){
  const rl = document.getElementById("roomList");
  rl.innerHTML = "";
  allRooms().forEach(r=>{
    const m = lastMsg(r.id);
    let prev = "Henüz mesaj yok";
    if(m){
      const who = m.from === me ? "Sen" : m.from;
      prev = who + ": " + (m.type==="image" ? "Fotoğraf "+icoImg : m.type==="audio" ? "Sesli mesaj "+icoMic : m.text.slice(0,40));
    }
    const photo = r.photo ? `<img src="${r.photo}">` : "";
    const el = document.createElement("div");
    el.className = "room-item" + (r.id===currentRoom ? " active" : "");
    el.innerHTML = `
      <div class="avatar">${photo}${esc((r.name||"?")[0].toUpperCase())}</div>
      <div class="room-meta">
        <div class="room-name">${esc(r.name)}</div>
        <div class="room-preview">${esc(prev)}</div>
      </div>`;
    el.onclick = ()=>{ SFX.pop(); openRoom(r.id); };
    rl.appendChild(el);
  });
}

function openRoom(id){
  currentRoom = id;
  document.getElementById("emptyState").style.display = "none";
  document.getElementById("chatView").classList.add("active");
  document.body.classList.add("in-chat");
  const r = allRooms().find(x=>x.id===id);
  document.getElementById("chatTitle").textContent = r.name;
  document.getElementById("chatSub").textContent = r.id==="general"
    ? Object.keys(users).length + " üye"
    : r.members.length + " üye";
  const av = document.getElementById("chatAvatar");
  av.outerHTML = avatarHTML(r.name,"sm").replace('class="avatar sm"','class="avatar sm" id="chatAvatar"');
  if(r.photo){ document.getElementById("chatAvatar").innerHTML = `<img src="${r.photo}">`; }
  document.getElementById("roomInfoBtn").style.display = r.id==="general" ? "none" : "";
  renderMessages(); renderRooms();
  document.getElementById("msgArea").scrollTop = 1e9;
}
document.getElementById("backBtn").onclick = ()=>{
  document.body.classList.remove("in-chat");
  currentRoom = null;
  document.getElementById("chatView").classList.remove("active");
  document.getElementById("emptyState").style.display = "flex";
  renderRooms();
};

/* ================= MESSAGES ================= */
function getMsgs(room){ return LS.get(K.msg(room), []); }
function pushMsg(room, msg){
  const arr = getMsgs(room);
  arr.push(msg);
  if(arr.length > 200) arr.splice(0, arr.length-200);
  if(!LS.set(K.msg(room), arr)){ alert("Depolama dolu — fotoğraf çok büyük olabilir."); return; }
  if(msg.from === me) SFX.send(); else SFX.receive();
  seenMsgIds[room] = msg.id;
  broadcast(); renderMessages(); renderRooms();
}
function sendText(){
  const inp = document.getElementById("msgInput");
  const t = inp.value.trim();
  if(!t || !currentRoom) return;
  inp.value = "";
  pushMsg(currentRoom, { id:uid(), from:me, type:"text", text:t, ts:Date.now() });
}
document.getElementById("sendBtn").onclick = sendText;
document.getElementById("msgInput").addEventListener("keydown", e=>{ if(e.key==="Enter") sendText(); });

function fmtTime(ts){ return new Date(ts).toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"}); }
function renderMessages(){
  if(!currentRoom) return;
  const area = document.getElementById("msgArea");
  const arr = getMsgs(currentRoom);
  let html = "";
  let lastDay = "";
  arr.forEach(m=>{
    const day = new Date(m.ts).toDateString();
    if(day !== lastDay){
      lastDay = day;
      html += `<div class="day-sep"><span>${esc(new Date(m.ts).toLocaleDateString("tr-TR", {day:"numeric",month:"short"}))}</span></div>`;
    }
    const mine = m.from === me;
    let body = "";
    if(m.type === "image") body = `<img class="shared" src="${m.text}" data-full="${m.text}" alt="fotoğraf">`;
    else if(m.type === "audio") body = `<audio controls src="${m.text}" style="max-width:220px"></audio>`;
    else body = esc(m.text);
    const sender = (!mine) ? `<div class="msg-sender">${nameHTML(m.from)}</div>` : "";
    html += `<div class="msg-row ${mine?"mine":""}">
      ${mine?"":avatarHTML(m.from,"sm")}
      <div class="msg-bubble">${sender}${body}<div class="msg-time">${fmtTime(m.ts)}</div></div>
    </div>`;
  });
  area.innerHTML = html;
  area.querySelectorAll("img.shared").forEach(img=>{
    img.onclick = ()=>{ document.getElementById("lightboxImg").src = img.dataset.full; document.getElementById("lightbox").classList.add("open"); };
  });
  area.scrollTop = 1e9;
}
document.getElementById("lightbox").onclick = ()=>{ document.getElementById("lightbox").classList.remove("open"); SFX.pop(); };

/* ================= PHOTO (sıkıştırılmış, kota dostu) ================= */
function fileToDataURL(file, max, quality, cb){
  const rd = new FileReader();
  rd.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > max || h > max){ const s = max/Math.max(w,h); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s)); }
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      try{ cb(cv.toDataURL("image/jpeg", quality)); }
      catch(e){ alert("Görsel işlenemedi."); }
    };
    img.onerror = ()=> alert("Görsel okunamadı.");
    img.src = rd.result;
  };
  rd.onerror = ()=> alert("Dosya okunamadı.");
  rd.readAsDataURL(file);
}
document.getElementById("imgBtn").onclick = ()=> document.getElementById("imgFile").click();
document.getElementById("imgFile").addEventListener("change", e=>{
  const f = e.target.files[0];
  if(!f || !currentRoom) return;
  fileToDataURL(f, 640, 0.68, data=>{
    pushMsg(currentRoom, { id:uid(), from:me, type:"image", text:data, ts:Date.now() });
  });
  e.target.value = "";
});

/* ================= VOICE ================= */
let mediaRecorder = null, chunks = [], recStream = null;
const micBtn = document.getElementById("micBtn");
async function startRec(e){
  e.preventDefault();
  if(!currentRoom) return;
  try{
    recStream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    mediaRecorder = new MediaRecorder(recStream);
    mediaRecorder.ondataavailable = ev=> chunks.push(ev.data);
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(chunks, {type: mediaRecorder.mimeType || "audio/webm"});
      const rd = new FileReader();
      rd.onload = ()=> pushMsg(currentRoom, { id:uid(), from:me, type:"audio", text:rd.result, ts:Date.now() });
      rd.readAsDataURL(blob);
      recStream.getTracks().forEach(t=>t.stop());
      micBtn.classList.remove("rec");
    };
    mediaRecorder.start();
    micBtn.classList.add("rec");
    SFX.pop();
  }catch(err){ alert("Mikrofon izni verilmedi."); }
}
function stopRec(){ if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); }
micBtn.addEventListener("mousedown", startRec);
micBtn.addEventListener("touchstart", startRec, {passive:false});
micBtn.addEventListener("mouseup", stopRec);
micBtn.addEventListener("touchend", stopRec);
micBtn.addEventListener("mouseleave", stopRec);

/* ================= GROUPS ================= */
const groupModal = document.getElementById("groupModal");
document.getElementById("newGroupBtn").onclick = ()=>{
  SFX.pop();
  const ml = document.getElementById("memberList");
  ml.innerHTML = "";
  Object.keys(users).filter(n=>n!==me).forEach(n=>{
    const l = document.createElement("label");
    l.className = "member-chk";
    l.innerHTML = `${avatarHTML(n,"sm")}<span>${nameHTML(n)}</span><input type="checkbox" value="${esc(n)}" style="margin-left:auto">`;
    ml.appendChild(l);
  });
  if(!ml.children.length) ml.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:8px 0">Henüz başka kullanıcı yok — sayfayı başka bir sekmede açıp ad kaparak ekle.</div>`;
  document.getElementById("groupName").value = "";
  document.getElementById("groupPhotoFile").value = "";
  document.getElementById("imgPreview").style.display = "none";
  groupModal.classList.add("open");
};
document.getElementById("cancelGroupBtn").onclick = ()=> groupModal.classList.remove("open");
let groupPhotoData = null;
document.getElementById("groupPhotoFile").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  fileToDataURL(f, 240, 0.72, d=>{
    groupPhotoData = d;
    const pv = document.getElementById("imgPreview");
    pv.src = d; pv.style.display = "block";
  });
  e.target.value = "";
});
document.getElementById("createGroupBtn").onclick = ()=>{
  const name = document.getElementById("groupName").value.trim();
  if(!name) return;
  const members = [me];
  document.querySelectorAll("#memberList input:checked").forEach(c=> members.push(c.value));
  const id = "g_" + uid();
  groups[id] = { name, photo: groupPhotoData, members, createdBy: me };
  groupPhotoData = null;
  saveGroups();
  SFX.group();
  groupModal.classList.remove("open");
  openRoom(id);
};

document.getElementById("roomInfoBtn").onclick = ()=>{
  const r = allRooms().find(x=>x.id===currentRoom);
  if(!r || currentRoom==="general") return;
  SFX.pop();
  document.getElementById("infoTitle").textContent = r.name;
  document.getElementById("infoBody").innerHTML =
    (r.photo?`<img src="${r.photo}" style="width:80px;height:80px;border-radius:50%;display:block;margin:0 auto 12px;object-fit:cover">`:"")+
    `<div style="font-size:13px;color:var(--muted);margin-bottom:8px">${r.members.length} üye</div>` +
    r.members.map(m=>`<div class="member-chk">${avatarHTML(m,"sm")}<span>${nameHTML(m)}</span>${m===r.createdBy?'<span style="margin-left:auto;font-size:11px;color:var(--muted)">kurucu</span>':""}</div>`).join("");
  document.getElementById("infoModal").classList.add("open");
};
document.getElementById("closeInfoBtn").onclick = ()=> document.getElementById("infoModal").classList.remove("open");

/* ================= PROFILE EDIT ================= */
const profileModal = document.getElementById("profileModal");
let profileColor = COLORS[0];
document.getElementById("meRow").onclick = ()=>{
  SFX.pop();
  document.getElementById("newNameInput").value = me;
  document.getElementById("profileErr").textContent = "";
  document.getElementById("profilePhotoFile").value = "";
  const cur = (users[me]||{}).color || COLORS[0];
  profileColor = cur;
  buildColorRow(document.getElementById("profileColorRow"), c=>{ profileColor=c; }, cur, me===C4NAR || cur===RGB);
  profileModal.classList.add("open");
};
document.getElementById("cancelProfileBtn").onclick = ()=> profileModal.classList.remove("open");
document.getElementById("saveProfileBtn").onclick = ()=>{
  const nn = document.getElementById("newNameInput").value.trim();
  const err = document.getElementById("profileErr");
  if(!nn){ err.textContent = "İsim boş olamaz."; return; }
  if(nn !== me && users[nn]){ err.textContent = "Bu ad zaten kapılmış."; return; }
  if(profileColor === RGB && nn !== C4NAR) profileColor = COLORS[0];   // RGB yalnız c4nar'a
  const f = document.getElementById("profilePhotoFile").files[0];
  const apply = (photo)=>{
    const oldPhoto = (users[me]||{}).photo;
    if(nn !== me){
      users[nn] = { ...(users[me]||{}), color: profileColor, photo: (photo !== undefined ? photo : oldPhoto) };
      delete users[me];
      Object.values(groups).forEach(g=>{ g.members = g.members.map(m=> m===me?nn:m); if(g.createdBy===me) g.createdBy=nn; });
      saveGroups();
      me = nn;
      LS.set(K.me, me);
    } else {
      users[me] = users[me] || {};
      users[me].color = profileColor;
      if(photo !== undefined) users[me].photo = photo;
    }
    saveUsers();
    SFX.group();
    renderMe(); renderRooms(); renderMessages();
    profileModal.classList.remove("open");
  };
  if(f) fileToDataURL(f, 240, 0.72, d=> apply(d));
  else apply(undefined);
};

/* ================= CALLS ================= */
const callOverlay = document.getElementById("callOverlay");
let callStream = null, callRoom = null, incomingCall = null;
const callChan = ("BroadcastChannel" in window) ? new BroadcastChannel("ki_call") : null;

function startCall(kind){
  if(!currentRoom) return;
  callRoom = currentRoom;
  const r = allRooms().find(x=>x.id===callRoom);
  showCallUI(r.name, kind, false);
  startRing();
  if(callChan) callChan.postMessage({ type:"ring", room:callRoom, from:me, kind });
}
async function showCallUI(peerName, kind, isIncoming){
  document.getElementById("callPeerName").textContent = peerName;
  document.getElementById("callStatus").textContent = isIncoming ? "Gelen "+(kind==="video"?"görüntülü":"sesli")+" arama…" : "Aranıyor…";
  document.getElementById("answerBtn").style.display = isIncoming ? "" : "none";
  document.getElementById("callPeerAvatar").innerHTML = esc((peerName||"?")[0].toUpperCase());
  callOverlay.classList.add("open");
  try{
    callStream = await navigator.mediaDevices.getUserMedia({audio:true, video: kind==="video"});
    const v = document.getElementById("localVideo");
    if(kind==="video"){ v.srcObject = callStream; v.style.display = "block"; }
    else v.style.display = "none";
  }catch(e){ document.getElementById("callStatus").textContent = "Kamera/mikrofon yok — sesli demo"; }
}
function endCall(){
  stopRing();
  if(callStream) callStream.getTracks().forEach(t=>t.stop());
  callStream = null;
  document.getElementById("localVideo").srcObject = null;
  callOverlay.classList.remove("open");
  SFX.callEnd();
  if(callChan && callRoom) callChan.postMessage({ type:"end", room:callRoom, from:me });
  callRoom = null;
}
document.getElementById("voiceCallBtn").onclick = ()=> startCall("voice");
document.getElementById("videoCallBtn").onclick = ()=> startCall("video");
document.getElementById("endCallBtn").onclick = endCall;
document.getElementById("muteBtn").onclick = ()=>{ if(callStream) callStream.getAudioTracks().forEach(t=> t.enabled = !t.enabled); };
document.getElementById("answerBtn").onclick = ()=>{
  stopRing();
  if(incomingCall){
    document.getElementById("callStatus").textContent = "Bağlandı — demo arama";
    SFX.login();
    if(callChan) callChan.postMessage({ type:"answer", room:incomingCall.room, from:me });
    incomingCall = null;
  }
};
if(callChan) callChan.onmessage = ev=>{
  const d = ev.data || {};
  if(d.from === me) return;
  if(d.type === "ring" && d.room === currentRoom){
    incomingCall = d;
    const r = allRooms().find(x=>x.id===d.room);
    showCallUI(d.from + " · " + (r?r.name:""), d.kind, true);
    startRing();
  }
  if(d.type === "answer" && d.room === callRoom){
    stopRing();
    document.getElementById("callStatus").textContent = "Bağlandı — demo arama";
  }
  if(d.type === "end" && callOverlay.classList.contains("open") && d.room === currentRoom && !incomingCall){
    endCall();
  }
};

/* ================= BOOT ================= */
if(me && users[me]){
  enterApp();
} else {
  LS.set(K.me, null);
}
